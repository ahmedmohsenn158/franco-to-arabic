[project]
name = "franco-to-arabic"
version = "0.1.0"
description = "Egyptian Arabizi to Arabic-script transliteration using neural sequence models"
readme = "README.md"
authors = [
    { name = "ahmedmohsenn158", email = "ahmedmohsenn158@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "jiwer>=4.0.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "polars>=2.1.0",
    "pyyaml>=6.0.3",
    "regex>=2026.11.19",
    "scikit-learn>=1.9.1",
    "tensorboard>=2.21.0",
    "torch>=2.15.0",
    "tqdm>=4.70.1",
]

[project.scripts]
arabizi-to-egyptian = "arabizi_to_egyptian:main"

[project.optional-dependencies]
demo = [
    "gradio>=6.32.0",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
